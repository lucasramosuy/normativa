name: Revisión semanal de IMPO

# Una vez por semana descarga la Constitución, los códigos (codigos.json) y las leyes y decretos (leyes.json) (respetando robots.txt
# y el Crawl-Delay de IMPO). Si el contenido cambió, abre un PR contra main con el
# resumen de artículos modificados/agregados/eliminados. Si no cambió nada, no hace nada.
# No publica en api: eso sigue siendo manual ("Publicar datos en api").

on:
  schedule:
    - cron: "17 9 * * 1" # lunes 06:17 (Montevideo)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape-semanal-impo
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: pip install -r requirements-scraper.txt
      - name: Descargar Constitución
        run: >-
          python scripts/ingest/scrape_constitucion.py
          --user-agent "normativa-uy-scraper/1.0 (+https://github.com/${{ github.repository }})"
      - name: Descargar códigos
        run: >-
          python scripts/ingest/scrape_codigos.py
          --user-agent "normativa-uy-scraper/1.0 (+https://github.com/${{ github.repository }})"
      - name: Descargar leyes y decretos
        # --tolerante: si una norma falla, se conserva su versión anterior y se sigue con las demás
        # (el error queda en reports/errores_leyes.json).
        run: >-
          python scripts/ingest/scrape_codigos.py --tolerante
          --config scripts/ingest/leyes.json
          --user-agent "normativa-uy-scraper/1.0 (+https://github.com/${{ github.repository }})"
      - name: Comparar con main
        id: diff
        run: |
          set +e
          python scripts/ingest/diff_datos.py --out "$RUNNER_TEMP/resumen.md"
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "cambios=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then exit "$code"; fi
          echo "cambios=si" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/resumen.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Sin cambios
        if: steps.diff.outputs.cambios == 'no'
        run: echo "IMPO no tiene cambios de contenido. No se abre PR." >> "$GITHUB_STEP_SUMMARY"
      - name: Abrir o actualizar PR
        if: steps.diff.outputs.cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rama="impo/actualizacion-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$rama"
          git add data reports
          git commit -m "Actualizar datos desde IMPO ($(date -u +%Y-%m-%d))"
          git push origin "$rama"
          titulo="Cambios en IMPO detectados el $(date -u +%Y-%m-%d)"
          gh pr create --base main --head "$rama" --title "$titulo" --body-file "$RUNNER_TEMP/resumen.md"
