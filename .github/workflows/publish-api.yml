name: Publicar datos en api

on:
  # Corre solo cuando cambian los datos en main (al mergear un PR de datos) y a mano.
  push:
    branches: [main]
    paths:
      - data/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
      - name: Checkout api
        uses: actions/checkout@v4
        with:
          ref: api
          path: api
          fetch-depth: 0
      - name: Copiar datos
        run: |
          rm -rf api/data api/reports
          cp -r main/data api/data
          cp -r main/reports api/reports
      - name: Historial de cambios
        # Compara lo que se va a publicar con lo ya publicado en api, artículo por artículo.
        # Solo entra lo publicado; los PRs sin publicar no aparecen.
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fecha="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "FECHA_PUBLICACION=$fecha" >> "$GITHUB_ENV"
          python3 ../main/scripts/ingest/historial.py --main ../main --main-sha "${GITHUB_SHA::7}" \
            --fecha "$fecha" --repo "$GITHUB_REPOSITORY"
      - name: Commit en api
        id: commit
        working-directory: api
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "api ya está al día."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Misma fecha que usó el historial, para que regenerarlo después dé idéntico.
          GIT_AUTHOR_DATE="$FECHA_PUBLICACION" GIT_COMMITTER_DATE="$FECHA_PUBLICACION" \
            git commit -m "Publicar datos desde main ${GITHUB_SHA::7}"
          git push origin api
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Checkout www
        uses: actions/checkout@v4
        with:
          ref: www
          path: www
          fetch-depth: 0
      - name: Regenerar catálogo de www
        # Catálogo (src/data/leyes.json) y línea de conteo del README, calculados desde
        # main y api. Si no hay nada que cambiar, no hace nada.
        id: catalogo
        run: |
          python3 main/scripts/ingest/sync_catalogo.py --main main --api api --www www | tee catalogo.log
          echo "$(grep '^cambios=' catalogo.log)" >> "$GITHUB_OUTPUT"
          echo "resumen=$(grep '^catalogo=' catalogo.log)" >> "$GITHUB_OUTPUT"
      - name: Abrir PR de catálogo contra www
        # Solo abre o actualiza el PR; lo mergea Lucas a mano. Rama fija: una corrida
        # nueva actualiza el PR abierto en vez de abrir otro.
        if: steps.catalogo.outputs.cambios == 'true'
        working-directory: www
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMEN: ${{ steps.catalogo.outputs.resumen }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B catalogo/auto
          git add src/data/leyes.json README.md
          git commit -m "Catálogo: sincronizar con los datos publicados (main ${GITHUB_SHA::7})"
          git push --force origin catalogo/auto
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head catalogo/auto --base www --state open --json number --jq '.[0].number')" ]; then
            echo "Ya hay un PR de catálogo abierto; se actualizó con el push."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base www --head catalogo/auto \
            --title "Catálogo: sincronizar con los datos publicados" \
            --body "Generado por **Publicar datos en api** desde main ${GITHUB_SHA::7}.

          Regenera \`src/data/leyes.json\` desde \`scripts/ingest/leyes.json\` y la línea de conteo del README. Los números salen de los datos (${RESUMEN}). No hay que tocar nada a mano: mergear este PR alcanza."
      - name: Redesplegar la web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref www
