
name: Actualizar Constitución desde IMPO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-constitucion-impo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-scraper.txt
      - name: Descargar y validar
        run: >-
          python scripts/ingest/scrape_constitucion.py
          --user-agent "normativa-uy-scraper/1.0 (+https://github.com/${{ github.repository }})"
      - name: Commit de salidas modificadas
        run: |
          if [ -z "$(git status --porcelain -- data/constitucion.jsonl reports/last_run.json)" ]; then
            echo "IMPO no produjo cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/constitucion.jsonl reports/last_run.json
          git commit -m "Actualizar Constitución desde IMPO"
          git push